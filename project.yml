# XcodeGen spec. Regenerate the .xcodeproj with `make project` (or `xcodegen generate`).
name: Split
options:
  bundleIdPrefix: com.consumecreate
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  xcodeVersion: "15.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: YES
    DEAD_CODE_STRIPPING: YES
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO

targets:
  Split:
    type: application
    platform: macOS
    sources:
      - path: Sources
      - path: Resources
        excludes:
          - "Info.plist"
          - "Split.entitlements"
    entitlements:
      path: Resources/Split.entitlements
    info:
      path: Resources/Info.plist
      properties:
        CFBundleName: Split
        CFBundleDisplayName: Split
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundlePackageType: APPL
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.productivity
        NSAppleEventsUsageDescription: Split reads the address of the active browser tab so websites are tracked separately from the browser itself. Nothing leaves your Mac.
        NSHumanReadableCopyright: MIT License
        NSPrincipalClass: NSApplication
        NSSupportsAutomaticTermination: false
        NSSupportsSuddenTermination: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.consumecreate.split
        PRODUCT_NAME: Split
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: ""
        COMBINE_HIDPI_IMAGES: YES
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        SWIFT_STRICT_CONCURRENCY: minimal
        OTHER_SWIFT_FLAGS: "-Xfrontend -warn-long-function-bodies=300"
    scheme:
      testTargets:
        - SplitTests

  SplitTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
    dependencies:
      - target: Split
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.consumecreate.split.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Split.app/Contents/MacOS/Split
        BUNDLE_LOADER: $(TEST_HOST)
        CODE_SIGN_IDENTITY: "-"
